  --bad: #E8483A;        /* 오류·정정·반박·기각 */
  --bad-soft: rgba(232, 72, 58, .12);
  /* 하네스 다섯 개의 색(필름 엔드카드 칩) */
  --h-assign: #2F7BFF; --h-audit: #FF6A2B; --h-naming: #19A974; --h-orgchange: #6C4CE0; --h-strategy: #0FA3B1;
  --acc: #1B2A4A;        /* 장의 하네스 색. 하네스 장이 아니면 남색 */
  --sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --display: "Paperlogy", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  --mono: "JetBrains Mono", "Pretendard", monospace;
  --serif: "Noto Serif KR", "Pretendard", serif;
}
.hz-assign { --acc: var(--h-assign); } .hz-audit { --acc: var(--h-audit); } .hz-naming { --acc: var(--h-naming); }
.hz-orgchange { --acc: var(--h-orgchange); } .hz-strategy { --acc: var(--h-strategy); }

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; transition: background-color .4s; }

body.bg-blue, body.bg-navy { background: var(--ink); }

#wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; z-index: 6; pointer-events: none; }
#wrap button { pointer-events: auto; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
  word-break: keep-all; font-kerning: normal; font-feature-settings: "ss01" 0; }

.slide { position: absolute; inset: 0; overflow: hidden; display: none; }
.slide.bg-paper { background: var(--paper); color: var(--ink); }
.slide.bg-ink, .slide.bg-night, .slide.bg-blue, .slide.bg-navy { background: var(--ink); color: var(--paper); }
.slide.bg-black { background: #000; color: #fff; }
.slide > .root { position: absolute; inset: 0; }

/* 배치 헬퍼 */
.a { position: absolute; }
.full { position: absolute; inset: 0; }

/* 글자 */
/* 머리말(필름과 같은 꼴): 왼쪽 세로 막대 + 회색 머리글 + Paperlogy 제목 */
.thead { position: relative; }
.thead .tbar { position: absolute; left: -32px; top: 4px; bottom: 6px; width: 13px; background: var(--acc); transform-origin: 50% 0; }
.kicker { font-size: 26px; font-weight: 600; letter-spacing: -0.005em; color: var(--mute); display: flex; align-items: center; gap: 14px; }
.kicker .dot { display: none; }
.bg-ink .kicker, .bg-night .kicker, .bg-blue .kicker, .bg-navy .kicker { color: rgba(253,243,226,.66); }
.h-title { font-family: var(--display); font-size: 70px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.14; color: var(--ink); }
.h-xl { font-family: var(--display); font-size: 124px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.05; color: var(--ink); }
.bg-ink .h-title, .bg-night .h-title, .bg-blue .h-title, .bg-navy .h-title, .bg-ink .h-xl, .bg-navy .h-xl, .bg-blue .h-xl { color: var(--paper); }
.h-sub { font-size: 32px; font-weight: 450; color: var(--ink-2); line-height: 1.5; letter-spacing: -0.01em; }
.bg-ink .h-sub, .bg-night .h-sub, .bg-blue .h-sub, .bg-navy .h-sub { color: rgba(253,243,226,.78); }
.body { font-size: 30px; line-height: 1.55; color: var(--ink-2); letter-spacing: -0.01em; }
.small { font-size: 24px; line-height: 1.5; color: var(--mute); }
.mono { font-family: var(--mono); letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.serif { font-family: var(--serif); }
.em-blue { color: var(--blue); } .em-ok { color: var(--ok); } .em-warn { color: var(--warn); } .em-bad { color: var(--bad); }

/* 칩: ID·상태·모델 */
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 8px;
  font-size: 22px; font-weight: 600; white-space: nowrap; line-height: 1; box-sizing: border-box; }
.chip.id { font-family: var(--mono); font-weight: 500; background: var(--paper-3); color: var(--ink); border: 1.5px solid var(--rule-2); }
.chip.ink { background: var(--ink); color: var(--paper); }
.chip.blue { background: var(--blue); color: #fff; }
.chip.ghost { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--rule-2); }
.chip.ok { background: var(--ok-soft); color: #0B7A52; border: 1.5px solid rgba(25,169,116,.45); }

.chip.lg { height: 52px; font-size: 28px; padding: 0 18px; border-radius: 10px; }
.bg-ink .chip.id, .bg-night .chip.id, .bg-navy .chip.id { background: rgba(255,255,255,.06); color: var(--paper); border-color: rgba(255,255,255,.25); }

/* 카드 */
.card { position: absolute; background: var(--paper-3); border: 1.5px solid var(--rule); border-radius: 16px; box-sizing: border-box;
  box-shadow: 0 1px 0 rgba(27,42,74,.04), 0 18px 40px -24px rgba(27,42,74,.30); }
.card.flat { box-shadow: none; }
.card.tint { background: var(--paper-2); }
.bg-ink .card, .bg-night .card { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); box-shadow: none; }

/* 에이전트 노드 */
.agent { position: absolute; box-sizing: border-box; border-radius: 14px; background: var(--paper-3); border: 2px solid var(--blue);
  padding: 16px 18px 14px; box-shadow: 0 16px 36px -22px rgba(47,123,255,.5); }
.agent .nm { font-family: var(--mono); font-size: 21px; font-weight: 500; color: var(--blue-2); letter-spacing: -0.01em; }
.agent .rl { font-size: 26px; font-weight: 700; color: var(--ink); margin-top: 6px; letter-spacing: -0.02em; line-height: 1.25; }
.agent .md { position: absolute; right: 12px; top: 12px; font-family: var(--mono); font-size: 16px; font-weight: 700; padding: 4px 8px; border-radius: 5px; }
.agent .md.opus { background: var(--ink); color: var(--paper); }
.agent .md.sonnet { background: transparent; color: var(--ink-2); border: 1.5px solid var(--ink-2); }
.agent.check { border-color: var(--bad); box-shadow: 0 16px 36px -22px rgba(232,72,58,.5); }
.agent.check .nm { color: #B3261E; }
.agent.judge { border-color: var(--warn); box-shadow: 0 16px 36px -22px rgba(232,147,12,.5); }
.agent.judge .nm { color: #965A00; }
.agent.write { border-color: var(--ink-2); box-shadow: 0 16px 36px -22px rgba(27,42,74,.4); }
.agent.write .nm { color: var(--ink-2); }

/* 스크립트 노드(사람·모델이 아닌 결정적 처리) */
.script { position: absolute; box-sizing: border-box; border-radius: 10px; border: 2px dashed var(--rule-2); background: transparent;
  padding: 10px 14px; font-family: var(--mono); font-size: 20px; color: var(--ink-2); white-space: nowrap; }
.script .cap { display: block; font-family: var(--sans); font-size: 20px; color: var(--mute); margin-top: 2px; white-space: normal; }
.human { position: absolute; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: #fff; padding: 10px 22px;
  font-size: 22px; font-weight: 700; white-space: nowrap; }

/* 표 */
.tbl { position: absolute; border-collapse: separate; border-spacing: 0; font-size: 24px; }
.tbl .tr { display: grid; align-items: center; border-bottom: 1.5px solid var(--rule); }
.tbl .th { font-size: 20px; font-weight: 700; color: var(--mute); padding: 12px 14px; }
.tbl .td { padding: 14px 14px; color: var(--ink); line-height: 1.35; }
.tbl .tr.head { border-bottom: 2px solid var(--ink); }

/* 도장 */
.stamp { position: absolute; font-size: 34px; font-weight: 850; letter-spacing: 0.04em; padding: 8px 20px; border: 5px solid currentColor;
  border-radius: 12px; transform-origin: 50% 50%; white-space: nowrap; mix-blend-mode: multiply; }
.stamp.ok { color: var(--ok); } .stamp.warn { color: var(--warn); } .stamp.bad { color: var(--bad); } .stamp.blue { color: var(--blue); }

/* 인용 */
.quote { position: absolute; font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.6; color: var(--ink); letter-spacing: -0.01em; }
.quote .src { display: block; font-family: var(--sans); font-weight: 500; font-size: 22px; color: var(--mute); margin-top: 16px; }

/* 하단 정보 */
.foot { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; pointer-events: none; z-index: 50; }
.foot .ch { position: absolute; left: 120px; bottom: 30px; font-size: 21px; font-weight: 600; color: rgba(27,42,74,.5); letter-spacing: -0.01em; padding-left: 28px; white-space: nowrap; }
.foot .ch::before { content: ""; position: absolute; left: 0; top: 50%; width: 15px; height: 15px; margin-top: -8px; background: var(--acc); transform: rotate(45deg) scale(.82); }
.foot .pg { position: absolute; right: 120px; bottom: 30px; font-size: 21px; font-weight: 600; color: rgba(27,42,74,.5); font-variant-numeric: tabular-nums; }
.foot.dark .ch, .foot.dark .pg { color: rgba(253,243,226,.55); }
.foot.dark .ch::before { background: var(--paper); }

/* 필름 재료: 작업장 그림, 말풍선, 하네스 칩, 역할 칩 */
.ill { position: absolute; mix-blend-mode: darken; pointer-events: none; }
.wicon { position: absolute; right: 96px; top: 34px; width: 200px; height: auto; mix-blend-mode: darken; pointer-events: none; z-index: 3; }
.qbub { position: absolute; padding: 24px 34px 26px; background: var(--ink); color: #fff; border-radius: 28px 28px 28px 6px;
  font: 700 44px/1.2 var(--sans); letter-spacing: -0.02em; white-space: nowrap; transform-origin: 0% 100%; }
.qbub .tag { font: 600 24px/1 var(--sans); letter-spacing: 0.02em; color: #8CC2F2; margin-bottom: 12px; }
.hchip { display: inline-flex; align-items: center; padding: 10px 22px 11px; border-radius: 999px; color: #fff; font: 800 32px/1 var(--display);
  letter-spacing: -0.02em; white-space: nowrap; box-sizing: border-box; }
.rchip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 11px; background: #fff; border: 2px solid var(--ink); border-radius: 999px;
  font: 700 24px/1 var(--sans); color: var(--ink); white-space: nowrap; box-sizing: border-box; }
.rchip .dia { width: 20px; height: 20px; background: var(--ink); transform: rotate(45deg) scale(.72); display: inline-block; flex: none; }
.capbar { position: absolute; background: var(--ink); color: #fff; border-radius: 16px; padding: 18px 34px; font: 600 32px/1.35 var(--sans); letter-spacing: -0.015em; }

/* 전환 */
.wipe-edge { position: absolute; top: 0; bottom: 0; width: 10px; z-index: 40; pointer-events: none; display: none; }

/* 영상 장 */
.vid { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; background: var(--paper); }
.vid-ctrl { position: absolute; right: 46px; bottom: 40px; z-index: 30; display: flex; gap: 10px; }
.vid-ctrl button { font: 600 20px var(--sans); color: #fff; background: rgba(27,42,74,.62); border: 1.5px solid rgba(255,255,255,.35);
  border-radius: 999px; padding: 10px 20px; cursor: pointer; backdrop-filter: blur(6px); }
.vid-ctrl button:hover { background: rgba(27,42,74,.85); }

#playov { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(27,42,74,.22); }
#playov[hidden] { display: none; }
#playov span { font: 700 22px var(--sans); color: #fff; background: #1B2A4A; border-radius: 999px; padding: 18px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
button:focus-visible { outline: 3px solid #2F7BFF; outline-offset: 3px; }

/* 화면 밖 UI(무대 비율과 무관) */
#notes { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(1100px, calc(100vw - 32px)); max-height: 34vh; overflow: auto;
  background: rgba(27,42,74,.95); color: #FDF3E2; border-radius: 14px; padding: 18px 22px; font-size: 16px; line-height: 1.65; z-index: 100;
  display: none; box-sizing: border-box; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
#notes b { color: #8CC2F2; font-weight: 700; }
#notes.on { display: block; }
#help { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(27,42,74,.9); color: #fff; font-size: 14px;
  padding: 10px 16px; border-radius: 999px; z-index: 101; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .5s; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#help.on { opacity: 1; }
#help .tc { display: none; }
@media (hover: none), (max-width: 760px) { #help .kb { display: none; } #help .tc { display: inline; } #help { max-width: calc(100vw - 32px); white-space: normal; text-align: center; } }
#navzones { position: fixed; inset: 0; z-index: 5; display: flex; }
#navzones div { flex: 1; cursor: pointer; }
#navzones div:first-child { flex: 0.5; cursor: w-resize; }
#navzones div:last-child { cursor: e-resize; }
body.still #navzones, body.still #help, body.still #notes { display: none !important; }

/* 에이전트 그림 묶음: 역할 그림 + 한글 이름표 + 하는 일 한 줄 */
.actor { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; --k: var(--blue); --k-soft: rgba(47,123,255,.22); --k-ink: #1456C8; }
.actor.k-check { --k: var(--bad); --k-soft: rgba(232,72,58,.22); --k-ink: #B3261E; }
.actor.k-judge { --k: var(--warn); --k-soft: rgba(232,147,12,.26); --k-ink: #965A00; }
.actor.k-write { --k: #3A4A6B; --k-soft: rgba(27,42,74,.2); --k-ink: #1B2A4A; }
.actor.k-script { --k: #8A8371; --k-soft: rgba(106,114,135,.22); --k-ink: #4F4A3D; }
.actor.k-human { --k: #1B2A4A; --k-soft: rgba(27,42,74,.22); --k-ink: #fff; }
.actor img { display: block; flex: none; mix-blend-mode: darken; transform-origin: 50% 100%; pointer-events: none; }
.actor .tag { display: inline-block; flex: none; margin-top: 6px; padding: 8px 18px 9px; border-radius: 999px; background: var(--paper-3); border: 3px solid var(--k);
  color: var(--k-ink); font: 800 28px/1.1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; transform-origin: 50% 0%; }
.actor.k-script .tag { border-style: dashed; }
.actor.k-human .tag { background: var(--ink); }
.actor .job { flex: none; margin-top: 10px; font: 600 26px/1.3 var(--sans); letter-spacing: -0.02em; color: var(--ink-2); }
/* 옮겨 다니는 문서 카드 */
.doc { position: absolute; box-sizing: border-box; background: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 10px 16px 11px;
  font: 700 24px/1.25 var(--sans); letter-spacing: -0.02em; color: var(--ink); box-shadow: 0 10px 22px -14px rgba(27,42,74,.55); white-space: nowrap; }
.doc.ok { border-color: var(--ok); } .doc.warn { border-color: var(--warn); } .doc.bad { border-color: var(--bad); } .doc.blue { border-color: var(--blue); }
/* 에이전트의 판단 한마디 */
.say { position: absolute; box-sizing: border-box; padding: 10px 18px 11px; border-radius: 16px; font: 800 26px/1.2 var(--sans); letter-spacing: -0.02em;
  color: #fff; background: var(--blue); white-space: nowrap; }
.say.ok { background: var(--ok); } .say.warn { background: var(--warn); } .say.bad { background: var(--bad); } .say.ink { background: var(--ink); }
.say.tail-l { border-bottom-left-radius: 4px; } .say.tail-r { border-bottom-right-radius: 4px; } .say.tail-b { border-radius: 16px; }

</style>

<body>
<div id="navzones"><div title="이전 장"></div><div></div><div title="다음 장"></div></div>
<div id="wrap"><div id="stage"></div></div>
<div id="playov" hidden><span>▶ 재생</span></div>
<div id="notes"></div>
<div id="help"><span class="kb">→ 다음 · ← 이전 · N 발표자 노트 · F 전체 화면 · R 다시 보기 · 숫자+Enter 장 이동</span><span class="tc">왼쪽을 누르면 이전 · 나머지를 누르면 다음 · 옆으로 밀어 넘김</span></div>
<script>
document.body.classList.add('bg-paper');
/* ── lib/helpers.js ── */
/* 시간 함수 헬퍼 — showreel 엔진(engine.js)에서 옮겨 온 코드. 화면은 시간의 순수 함수로 그린다. */
(function () {
  'use strict';
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const map = (x, a, b, c, d, e) => lerp(c, d, (e || (p => p))(clamp((x - a) / (b - a))));

  // 큐빅 베지어 이징 (CSS cubic-bezier 와 같은 정의)
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t;
    const sy = t => ((ay * t + by) * t + cy) * t;
    const dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return p => {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      let t = p;
      for (let i = 0; i < 8; i++) {
        const e = sx(t) - p;
        if (Math.abs(e) < 1e-6) break;
        const d = dx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      return sy(clamp(t));
    };
  }

  const ease = {
    linear: p => p,
    inQuad: p => p * p,
    outQuad: p => 1 - (1 - p) * (1 - p),
    inOutQuad: p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
    inCubic: p => p * p * p,
    outCubic: p => 1 - Math.pow(1 - p, 3),
    inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    inQuart: p => p ** 4,
    outQuart: p => 1 - Math.pow(1 - p, 4),
    inOutQuart: p => (p < 0.5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2),
    outQuint: p => 1 - Math.pow(1 - p, 5),
    inExpo: p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inOutExpo: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
    outBack: (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
    inBack: (p, s = 1.70158) => (s + 1) * p * p * p - s * p * p,
    outElastic: p => (p <= 0 || p >= 1 ? clamp(p) : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
    inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
    // 모션 디자인에서 자주 쓰는 곡선(After Effects 감성)
    snap: bezier(0.16, 1, 0.3, 1),      // 강한 감속 등장 — 기본 등장 곡선
    swift: bezier(0.83, 0, 0.17, 1),    // 강한 in-out — 와이프·카메라 이동
    exit: bezier(0.7, 0, 0.84, 0),      // 가속 퇴장
    pop: bezier(0.34, 1.56, 0.64, 1),   // 살짝 넘쳤다 돌아옴 — 칩·아이콘
  };

  // start부터 dur 동안 0→1 (이징 적용)
  const prog = (t, start, dur, e = ease.snap) => e(clamp((t - start) / Math.max(1e-6, dur)));
  // 등장·퇴장 창: a에서 inDur 동안 0→1, b에서 outDur 동안 1→0
  const win = (t, a, b, inDur = 0.4, outDur = 0.3, ei = ease.snap, eo = ease.exit) =>
    Math.min(prog(t, a, inDur, ei), 1 - prog(t, b - outDur, outDur, eo));
  // 키프레임 보간: kf(t, [[0, 0], [0.5, 1, ease.outExpo], [2, 0]]) — 각 구간 이징은 도착 키프레임에 적는다
  function kf(t, frames) {
    if (t <= frames[0][0]) return frames[0][1];
    for (let i = 1; i < frames.length; i++) {

  // o.person = { x, y, w } (root 기준, 자른 그림 중심과 폭) 또는 false. o.bx, o.by = 말풍선 자리. o.shown = true 면 처음부터 다 보인다.

      render(lt, t0 = 0) {
        const p = prog(lt, t0, 0.5, ease.pop), a = prog(lt, t0, 0.2, ease.linear);
        el.style.opacity = a.toFixed(3);
        im.style.transform = `translateY(${((1 - p) * 30).toFixed(1)}px) scale(${lerp(0.8, 1, p).toFixed(4)})`;
        tag.style.transform = `scale(${prog(lt, t0 + 0.12, 0.4, ease.pop).toFixed(4)})`;
        if (job) job.style.opacity = prog(lt, t0 + 0.3, 0.3).toFixed(3);
        return a;
      },
      act(lt, on) {
        const k = on ? 1 : 0;
        im.style.transform = `translateY(${(-k * 10 * (0.5 - 0.5 * Math.cos(lt * Math.PI * 2 / 0.9))).toFixed(1)}px)`;

      },

  };

  K.doc = (parent, html, box = {}, cls = '') => K.at(parent, 'doc ' + cls, box, html);
  // 요소를 from → to 로 옮긴다(절대 좌표, 요소의 왼쪽 위 기준). o.arc = 위로 휘는 높이(px). 반환값 0~1.
  K.travel = (el, lt, t0, dur, from, to, o = {}) => {
    const p = prog(lt, t0, dur, o.ease || ease.inOutCubic);
    const x = lerp(from[0], to[0], p), y = lerp(from[1], to[1], p) - Math.sin(p * Math.PI) * (o.arc ?? 0);
    el.style.left = x.toFixed(1) + 'px'; el.style.top = y.toFixed(1) + 'px';
    if (o.fade !== false) el.style.opacity = (lt < t0 ? (o.pre ?? 0) : 1).toFixed(3);

  };

  // 반환값 { i: 지금 단계(-1 = 시작 전), u: 그 단계 안에서 0~1, t: 이번 바퀴에서 지난 초, lap: 몇 바퀴째 }
  K.loop = (lt, t0, durs) => {
    if (lt < t0) return { i: -1, u: 0, t: 0, lap: 0 };

    for (let i = 0; i < durs.length; i++) { if (t < acc + durs[i]) return { i, u: (t - acc) / durs[i], t, lap }; acc += durs[i]; }
    return { i: durs.length - 1, u: 1, t, lap };

  });

  // ── 이 파일의 공통 값과 함수 ─────────────────────────
  const OKD = '#0B7A52', WAD = '#965A00', BADD = '#B3261E';
  const show = (e, on, pre) => { e.style.opacity = on ? '1' : '0'; e.style.transform = (pre || '') + `scale(${on ? 1 : 0.8})`; };
  const TAPE = 'repeating-linear-gradient(-45deg,#1B2A4A 0 10px,#3A4A6B 10px 20px)';

  // 문서 한 건이 에이전트를 차례로 거치는 장. 위쪽 카드에 문서 제목과 분류, 아래에 에이전트.
  // o.st = [{ a: K.actor 옵션, say, cls, blind }], o.doc = { dept, title, oldLab, old, oldCls, strike, newLab, neu, resCls, extra, stamp }
  function procSlide(o) {

      id: o.id, title: o.title, chapter: o.chapter, harness: o.harness, notes: o.notes,
      setup(root, d) {
        d.T = K.title(root, { kicker: o.kicker, title: o.title, size: o.size });
        const c = o.doc, res = c.resCls || 'bad';

        at(d.card, '', { x: 34, y: 20 }, c.dept, 'font:600 26px/1.2 var(--sans);color:var(--mute)');
        at(d.card, '', { x: 34, y: 56, w: 1400 }, c.title, 'font:800 38px/1.25 var(--sans);letter-spacing:-0.025em;white-space:nowrap');
        d.row = at(d.card, '', { x: 34, y: 118 }, '', 'display:flex;align-items:center;gap:16px');

        d.tape.style.clipPath = `inset(0 ${((1 - tp) * 100).toFixed(1)}% 0 0)`;
        // 마지막 단계: 결과가 카드에 적히고 도장이 찍힌다
        if (o.doc.strike === false) d.strike.style.opacity = '0'; else K.wipe(d.strike, lt, 1.5, 0.35);
        K.rise(d.arrow, lt, 1.6, { x: -12, y: 0, blur: 0 });

        if (d.extra) K.rise(d.extra, lt, 1.9, { x: -12, y: 0, blur: 0 });
        K.stamp(d.stamp, fin ? 10 + L.u * FIN : lt, fin ? 10.2 : 2.1, { rot: -6 });

        // 문서 표식의 이동

        if (odd) { K.travel(d.tok, 1, 0, 1, P[k], P[k]); return; }

        const cell = (t, x, st) => T(row, t, x - 100, 0, 'height:112px;display:flex;align-items:center;font:700 32px/1.25 var(--sans);letter-spacing:-0.03em;color:var(--ink-2);' + (st || ''), 0);
        const a = cell(r[1], X[1]); a.style.width = '340px';
        const b = cell(r[2], X[2]); b.style.width = '370px';
        const c = cell(r[3], X[3], 'font-weight:800;color:var(--ink)'); c.style.width = '470px';
        const cy = y + 56;
        const p1 = K.path(d.svg, [[X[2] - 62, cy], [X[2] - 22, cy]], { color: K.HZ[r[0]].c, width: 4, arrow: true });
        const p2 = K.path(d.svg, [[X[3] - 62, cy], [X[3] - 22, cy]], { color: K.HZ[r[0]].c, width: 4, arrow: true });
        return { row, a, b, c, p1, p2 };
      });
    },
    render(lt, d) {
      d.T.render(lt);
      d.hd.forEach((e, i) => K.rise(e, lt, 0.4 + i * 0.06, { y: 8 }));
      K.wipe(d.rule, lt, 0.5, 0.6);
      d.rows.forEach((r, i) => {
        const t0 = 0.7 + i * 0.14;
        K.rise(r.row, lt, t0, { y: 16, blur: 4 });
        K.draw(r.p1, lt, t0 + 0.3, 0.3); K.draw(r.p2, lt, t0 + 0.45, 0.3);
      });
      // 한 줄씩: 받는 것 → 내는 것 → 사람이 정하는 것 순서로 짚는다
      const L = K.loop(lt, 2.6, Array(5).fill(2.1));
      d.rows.forEach((r, i) => {
        const on = L.i === i, st = on ? Math.min(2, Math.floor(L.u * 3)) : -1;
        K.mark(r.row, on, 'rgba(27,42,74,.06)');
        [r.a, r.b, r.c].forEach((e, j) => { e.style.opacity = L.i < 0 || !on || j <= st ? '1' : '0.28'; });
      });
    },
  });

  // 한계
  DECK.slide({
    id: 'limits', title: '이번 결과에는 한계가 네 가지 있다', chapter: CH,
    notes: '한계를 먼저 말씀드린다.\n첫째, 하네스는 문서 제목만 보고 판단한다. 문서목록에는 본문·첨부가 없다. 제목이 짧으면 미배정·사람 확인으로 남긴다.\n둘째, 시험 규모가 작다. 제목 배정은 제목 40개(문서 56건), 오분류 점검은 문서 600건(시험용으로 넣어 둔 오류 128건)으로 시험했다.\n셋째, 생산현황 문서 535,148건은 분류기준표에 없는 부서가 만들었다. 다른 공항 기준표를 적용한 부서 522,546건, 없어진 부서(현재 부서로 추정) 12,185건, 적용 대상이 아닌 부서 417건이다.\n넷째, 조직 개편 추천안은 인원·예산 자료가 없어 「별도 산정 필요」로 남겼다.\n출처: kac-record-assign/output/t1/요약.md, kac-classification-audit/output/test01/요약.md, kac-shared/data/dept_map.json, kac-org-strategy/output/20261117-safety/조직개편_추천보고서.md',
    setup(root, d) {
      d.T = K.title(root, { kicker: '남은 일', title: '이번 결과에는 한계가 네 가지 있다' });
      const big = 'font:900 104px/1 var(--display);letter-spacing:-0.04em;color:var(--warn);white-space:nowrap';
      const unit = 'font-size:54px;color:var(--ink);margin-left:4px';
      const sm = 'font:700 30px/1 var(--sans);letter-spacing:-0.02em;color:var(--ink-2);margin-left:12px;margin-right:36px';
      const L = [
        [`<span style="${big}">제목만</span>`, '본문과 첨부는 보지 않았다'],
        [`<span class="num" style="${big}">40<span style="${unit}">개</span></span><span style="${sm}">제목</span><span class="num" style="${big}">600<span style="${unit}">건</span></span><span style="${sm}">문서</span>`, '시험한 양이 적다'],
        [`<span class="num" style="${big}">535,148<span style="${unit}">건</span></span>`, '분류기준표에 없는 부서의 문서'],
        [`<span style="${big}">인원·예산</span>`, '자료가 없어 계산하지 않았다'],
      ];
      d.cards = L.map((it, i) => {
        const c = K.at(root, 'card', { x: 120 + (i % 2) * 860, y: 300 + Math.floor(i / 2) * 330, w: 820, h: 300 });
        const a = h('div', '', c, it[0]); a.style.cssText = 'position:absolute;left:44px;top:54px;white-space:nowrap;display:flex;align-items:baseline';
        const b = h('div', '', c, it[1]); b.style.cssText = 'position:absolute;left:46px;top:192px;font:700 42px/1.2 var(--sans);letter-spacing:-0.03em;color:var(--ink)';
        return c;
      });
    },
    render(lt, d) {
      d.T.render(lt);
      d.cards.forEach((c, i) => K.rise(c, lt, 0.6 + i * 0.18, { y: 22 }));
      // 한계를 차례로 짚는다
      const k = K.cycle(lt, 2.6, 1.6, 4);
      d.cards.forEach((c, i) => {
        if (lt > 2.4) c.style.transform = `translateY(${k === i ? -8 : 0}px)`;
        RH.set(c, 'boxShadow', k === i ? '0 0 0 5px ' + C.warn : '0 18px 40px -24px rgba(27,42,74,.30)');
      });
    },
  });

  // 다음 단계
  DECK.slide({
    id: 'limits-2', title: '다음에는 세 가지를 한다', chapter: CH,
    notes: '다음 단계는 세 가지다.\n첫째, 남은 제목을 이어서 배정한다. 감사실·제주운영단 2026년의 남은 고유 제목이 14,259개이고, 그다음은 다른 부서·연도다.\n둘째, 사람이 확인한 결과를 규칙에 반영한다. 검토필요·사람 확인 건을 사람이 판정하면 그 결과를 규칙 스킬에 넣는다.\n셋째, 분류기준표를 고친 뒤 같은 하네스를 다시 실행한다. 비상계획실의 이름이 빈 34행, 다른 공항 기준표를 적용한 부서의 기준표가 대상이다.\n출처: kac-record-assign/output/t1/요약.md, kac-shared/data/classification.json',
    setup(root, d) {
      d.T = K.title(root, { kicker: '남은 일', title: '다음에는 세 가지를 한다' });
      d.svg = K.svg(root);
      d.a1 = K.actor(root, { kind: 'make', name: '배정 에이전트', x: 270, y: 330, w: 250 });
      d.hu = K.actor(root, { kind: 'human', name: '사람', x: 870, y: 300, w: 186 });
      // 분류기준표: 빈 칸이 있는 작은 표
      d.tb = K.at(root, 'card', { x: 1390, y: 372, w: 290, h: 220 });
      d.tc = [];
      for (let i = 0; i < 9; i++) {
        const e = K.at(d.tb, '', { x: 22 + (i % 3) * 84, y: 22 + Math.floor(i / 3) * 62, w: 78, h: 50 });
        const blank = [4, 5, 7, 8].includes(i);
        e.style.cssText += ';box-sizing:border-box;border-radius:8px;' + (blank ? 'border:3px dashed var(--warn);background:var(--warn-soft)' : 'background:rgba(27,42,74,.78)');
        d.tc.push({ e, blank });
      }
      d.tt = T(root, '분류기준표', 1390, 610, 'text-align:center', 290);
      d.tt.innerHTML = '<span style="display:inline-block;padding:8px 18px 9px;border-radius:999px;background:var(--paper-3);border:3px solid var(--ink-2);font:800 28px/1.1 var(--sans);letter-spacing:-0.02em;color:var(--ink)">분류기준표</span>';
      const cap = (html, cx) => T(root, html, cx - 250, 696, 'text-align:center;font:700 34px/1.35 var(--sans);letter-spacing:-0.03em;color:var(--ink)', 500);
      const em = 'color:var(--blue);font-weight:900';
      d.c1 = cap(`남은 제목 <span class="num" style="${em}">14,259개</span>를<br>이어서 배정한다`, 395);
      d.c2 = cap('사람이 확인한 결과를<br>규칙에 넣는다', 963);
      d.c3 = cap(`빈 <span class="num" style="${em}">34행</span>을 채우고<br>다시 실행한다`, 1535);
      d.p1 = K.path(d.svg, [[560, 480], [830, 480]], { color: C.ink2, width: 4, arrow: true });
      d.p2 = K.path(d.svg, [[1096, 480], [1360, 480]], { color: C.ink2, width: 4, arrow: true });
      d.p3 = K.path(d.svg, [[1535, 800], [1535, 880], [395, 880], [395, 806]], { color: C.blue, width: 4, arrow: true, radius: 26 });
      d.pl = T(root, '다시 실행', 860, 858, 'text-align:center;font:800 32px/1.4 var(--sans);letter-spacing:-0.02em;color:#1456C8;background:var(--paper)', 210);
      d.doc = K.doc(root, '문서 제목', { x: 0, y: 0 });
    },
    render(lt, d) {
      d.T.render(lt);
      d.a1.render(lt, 0.5); d.hu.render(lt, 0.7);
      K.pop(d.tb, lt, 0.9); K.rise(d.tt, lt, 1.0, { y: 8 });
      K.draw(d.p1, lt, 0.9, 0.35); K.draw(d.p2, lt, 1.1, 0.35);
      [d.c1, d.c2, d.c3].forEach((e, i) => K.rise(e, lt, 1.2 + i * 0.15, { y: 12 }));
      K.draw(d.p3, lt, 1.7, 0.8); K.rise(d.pl, lt, 2.2, { y: 0 });
      // 배정 → 사람 확인 → 기준표 고치기 → 다시 실행
      const L = K.loop(lt, 2.6, [1.4, 1.0, 1.4, 1.0, 1.5, 1.3]);
      const st = L.i, u = L.u;
      d.a1.act(lt, st === 0 && u > 0.2); d.hu.act(lt, st === 2);
      [d.c1, d.c2, d.c3].forEach((e, i) => { if (lt > 2.4) e.style.opacity = st < 0 || [[0], [1, 2], [3, 4, 5]][i].includes(st) ? '1' : '0.55'; });
      // 표의 빈 칸이 채워진다(4단계). 다시 실행 단계까지 채워진 채로 있다가 다음 바퀴에 처음으로 돌아간다
      const fill = st === 4 ? u : st === 5 ? 1 : 0;
      let bi = 0;
      d.tc.forEach(c => {
        if (!c.blank) return;
        const on = fill > 0.15 + bi * 0.18; bi++;
        RH.set(c.e, 'background', on ? C.ok : 'rgba(232,147,12,.14)');
        RH.set(c.e, 'borderColor', on ? C.ok : C.warn); RH.set(c.e, 'borderStyle', on ? 'solid' : 'dashed');
      });
      if (lt > 1.4) RH.set(d.tb, 'boxShadow', st === 4 ? '0 0 0 5px ' + C.ok : '0 18px 40px -24px rgba(27,42,74,.30)');
      if (st < 0) { d.doc.style.opacity = '0'; return; }
      const P = { in: [150, 268], a1: [330, 268], hu: [905, 240], tb: [1470, 310] };
      d.doc.className = 'doc' + (st >= 2 && st <= 3 ? ' ok' : '');
      if (st === 0) K.travel(d.doc, u, 0, 0.4, P.in, P.a1, { arc: 20 });
      else if (st === 1) K.travel(d.doc, u, 0, 1, P.a1, P.hu, { arc: 36 });
      else if (st === 2) K.travel(d.doc, 1, 0, 1, P.hu, P.hu);
      else if (st === 3) K.travel(d.doc, u, 0, 1, P.hu, P.tb, { arc: 36 });
      else K.travel(d.doc, 1, 0, 1, P.tb, P.tb);
      d.doc.style.opacity = (st === 0 ? clamp(u / 0.15) : st === 4 ? clamp((1 - u) / 0.2) : st === 5 ? 0 : 1).toFixed(3);
      // 다시 실행: 아래 선을 따라 점이 에이전트로 돌아간다
      if (!d.dot) d.dot = s('circle', { r: 10, fill: C.blue }, d.svg);
      if (st === 5) {
        const pt = d.p3.getPointAtLength(ease.inOutCubic(u) * d.p3._len);
        d.dot.setAttribute('cx', pt.x.toFixed(1)); d.dot.setAttribute('cy', pt.y.toFixed(1));
        d.dot.style.opacity = Math.min(1, u / 0.1, (1 - u) / 0.1).toFixed(3);
      } else d.dot.style.opacity = '0';
    },
  });

  // 맺음: 표지와 같은 건물로 돌아온다. 맺음 문장과 기록연구사의 질문만 둔다
  DECK.slide({
    id: 'close', title: '맺음', chapter: CH,
    notes: '하네스는 고칠 안과 근거를 파일로 내고, 반영 여부는 담당자와 경영진이 정한다. 필름의 마지막 말과 같다: 모든 산출물은 사람이 검토할 추천이다.\n화면의 질문은 필름이 끝난 질문 「그럼, 첫 문서부터 분류해 볼까요?」다. 다음 실행은 감사실·제주운영단 2026년의 남은 고유 제목 14,259개다(다음 단계 장). 질문을 받겠다.\n결과 파일 위치:\n제목 배정 — kac-record-assign/output/t1/배정결과.xlsx\n오분류 점검 — kac-classification-audit/output/test01/정정안.csv\n단위업무명 추천 — kac-unit-task-naming/output/20261117-감사실/단위업무_제안표.xlsx\n조직 변경 영향 — kac-org-change-impact/output/시나리오-신공항건설1부이동/영향도_보고서.md\n조직 개편 추천 — kac-org-strategy/output/20261117-safety/조직개편_추천보고서.md',
    setup(root, d) {
      d.arch = K.sprite(root, 'g01_archive', { x: 1440, y: 560, w: 1040, origin: '50% 70%' });
      d.l1 = K.at(root, '', { x: 116, y: 170, w: 1300 }, '하네스는 고칠 안과 근거를 내고,');
      d.l2 = K.at(root, '', { x: 116, y: 280, w: 1300 }, '결정은 사람이 한다.');
      [d.l1, d.l2].forEach(e => { e.style.cssText += ';font:900 88px/1.18 var(--display);letter-spacing:-0.04em;color:var(--ink);white-space:nowrap'; });
      d.l2.style.color = K.C.ok;
      d.w1 = RH.split(d.l1, 'char', { mask: true }); d.w2 = RH.split(d.l2, 'char', { mask: true });
      // 필름 마지막 질문으로 끝낸다. 표지가 이 질문에서 시작했다
      d.Q = K.question(root, '그럼, 첫 문서부터 분류해 볼까요?', { x: 70, y: 600, person: { x: 102, y: 150, w: 235 }, bx: 225, by: 70, size: 50, pad: '26px 38px 28px', tagSize: 26 });
    },
    render(lt, d) {
      d.w1.forEach((w, i) => { const p = RH.stagger(lt, 0.15, 0.025, 0.55, i); w.style.transform = `translateY(${((1 - p) * 120).toFixed(1)}%)`; });
      d.w2.forEach((w, i) => { const p = RH.stagger(lt, 0.65, 0.03, 0.55, i); w.style.transform = `translateY(${((1 - p) * 120).toFixed(1)}%)`; });
      d.Q.render(lt, 1.4, 24);
      // 건물은 천천히 다가왔다 물러나기를 되풀이한다
      const pa = prog(lt, 0.2, 0.9, ease.outCubic);
      d.arch.style.opacity = pa.toFixed(3);
      d.arch.style.transform = `translateY(${((1 - pa) * 40).toFixed(1)}px) scale(${(1 + 0.035 * K.wave(Math.max(0, lt - 1), 14)).toFixed(4)})`;
    },
  });
})();
