:root {
  /* 필름(기록관리 하네스 120초)과 같은 팔레트 */
  --paper: #FDF3E2;      /* 바탕(필름 일러스트의 바탕색) */
  --paper-2: #F4E6CC;    /* 카드·표 머리 */
  --paper-3: #FFFAF2;    /* 밝은 카드 */
  --line: #E3D3B4;
  --ink: #1B2A4A;        /* 남색: 글자·말풍선 */
  --ink-2: #3A4A6B;
  --mute: #6A7287;
  --rule: rgba(27, 42, 74, .14);
  --rule-2: rgba(27, 42, 74, .30);
  --night: #1B2A4A;
  --blue: #2F7BFF;       /* 에이전트·하네스 흐름 */
  --blue-2: #1F5FD6;
  --blue-soft: rgba(47, 123, 255, .12);
  --ok: #19A974;         /* 확정·통과·타당 */
  --ok-soft: rgba(25, 169, 116, .13);
  --warn: #E8930C;       /* 검토필요·보완·수정필요 */
  --warn-soft: rgba(232, 147, 12, .14);
  --bad: #E8483A;        /* 오류·정정·반박·기각 */
  --bad-soft: rgba(232, 72, 58, .12);
  /* 하네스 다섯 개의 색(필름 엔드카드 칩) */
  --h-assign: #2F7BFF; --h-audit: #FF6A2B; --h-naming: #19A974; --h-orgchange: #6C4CE0; --h-strategy: #0FA3B1;
  --acc: #1B2A4A;        /* 장의 하네스 색. 하네스 장이 아니면 남색 */
  --sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --display: "Paperlogy", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  --mono: "JetBrains Mono", "Pretendard", monospace;
  --serif: "Noto Serif KR", "Pretendard", serif;
}
.hz-assign { --acc: var(--h-assign); } .hz-audit { --acc: var(--h-audit); } .hz-naming { --acc: var(--h-naming); }
.hz-orgchange { --acc: var(--h-orgchange); } .hz-strategy { --acc: var(--h-strategy); }

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; transition: background-color .4s; }
body.bg-ink, body.bg-night { background: var(--night); }
body.bg-blue, body.bg-navy { background: var(--ink); }
body.bg-black { background: #000; }

#wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; z-index: 6; pointer-events: none; }
#wrap button { pointer-events: auto; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
  word-break: keep-all; font-kerning: normal; font-feature-settings: "ss01" 0; }

.slide { position: absolute; inset: 0; overflow: hidden; display: none; }
.slide.bg-paper { background: var(--paper); color: var(--ink); }
.slide.bg-ink, .slide.bg-night, .slide.bg-blue, .slide.bg-navy { background: var(--ink); color: var(--paper); }
.slide.bg-black { background: #000; color: #fff; }
.slide > .root { position: absolute; inset: 0; }

/* 배치 헬퍼 */
.a { position: absolute; }
.full { position: absolute; inset: 0; }

/* 글자 */
/* 머리말(필름과 같은 꼴): 왼쪽 세로 막대 + 회색 머리글 + Paperlogy 제목 */
.thead { position: relative; }
.thead .tbar { position: absolute; left: -32px; top: 4px; bottom: 6px; width: 13px; background: var(--acc); transform-origin: 50% 0; }
.kicker { font-size: 26px; font-weight: 600; letter-spacing: -0.005em; color: var(--mute); display: flex; align-items: center; gap: 14px; }
.kicker .dot { display: none; }
.bg-ink .kicker, .bg-night .kicker, .bg-blue .kicker, .bg-navy .kicker { color: rgba(253,243,226,.66); }
.h-title { font-family: var(--display); font-size: 70px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.14; color: var(--ink); }
.h-xl { font-family: var(--display); font-size: 124px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.05; color: var(--ink); }
.bg-ink .h-title, .bg-night .h-title, .bg-blue .h-title, .bg-navy .h-title, .bg-ink .h-xl, .bg-navy .h-xl, .bg-blue .h-xl { color: var(--paper); }
.h-sub { font-size: 32px; font-weight: 450; color: var(--ink-2); line-height: 1.5; letter-spacing: -0.01em; }
.bg-ink .h-sub, .bg-night .h-sub, .bg-blue .h-sub, .bg-navy .h-sub { color: rgba(253,243,226,.78); }
.body { font-size: 30px; line-height: 1.55; color: var(--ink-2); letter-spacing: -0.01em; }
.small { font-size: 24px; line-height: 1.5; color: var(--mute); }
.mono { font-family: var(--mono); letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.serif { font-family: var(--serif); }
.em-blue { color: var(--blue); } .em-ok { color: var(--ok); } .em-warn { color: var(--warn); } .em-bad { color: var(--bad); }

/* 칩: ID·상태·모델 */
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 8px;
  font-size: 22px; font-weight: 600; white-space: nowrap; line-height: 1; box-sizing: border-box; }
.chip.id { font-family: var(--mono); font-weight: 500; background: var(--paper-3); color: var(--ink); border: 1.5px solid var(--rule-2); }
.chip.ink { background: var(--ink); color: var(--paper); }
.chip.blue { background: var(--blue); color: #fff; }
.chip.ghost { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--rule-2); }
.chip.ok { background: var(--ok-soft); color: #0B7A52; border: 1.5px solid rgba(25,169,116,.45); }
.chip.warn { background: var(--warn-soft); color: #965A00; border: 1.5px solid rgba(232,147,12,.5); }
.chip.bad { background: var(--bad-soft); color: #B3261E; border: 1.5px solid rgba(232,72,58,.45); }
.chip.sm { height: 32px; font-size: 18px; padding: 0 10px; border-radius: 6px; }
.chip.lg { height: 52px; font-size: 28px; padding: 0 18px; border-radius: 10px; }
.bg-ink .chip.id, .bg-night .chip.id, .bg-navy .chip.id { background: rgba(255,255,255,.06); color: var(--paper); border-color: rgba(255,255,255,.25); }

/* 카드 */
.card { position: absolute; background: var(--paper-3); border: 1.5px solid var(--rule); border-radius: 16px; box-sizing: border-box;
  box-shadow: 0 1px 0 rgba(27,42,74,.04), 0 18px 40px -24px rgba(27,42,74,.30); }
.card.flat { box-shadow: none; }
.card.tint { background: var(--paper-2); }
.bg-ink .card, .bg-night .card { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); box-shadow: none; }

/* 에이전트 노드 */
.agent { position: absolute; box-sizing: border-box; border-radius: 14px; background: var(--paper-3); border: 2px solid var(--blue);
  padding: 16px 18px 14px; box-shadow: 0 16px 36px -22px rgba(47,123,255,.5); }
.agent .nm { font-family: var(--mono); font-size: 21px; font-weight: 500; color: var(--blue-2); letter-spacing: -0.01em; }
.agent .rl { font-size: 26px; font-weight: 700; color: var(--ink); margin-top: 6px; letter-spacing: -0.02em; line-height: 1.25; }
.agent .md { position: absolute; right: 12px; top: 12px; font-family: var(--mono); font-size: 16px; font-weight: 700; padding: 4px 8px; border-radius: 5px; }
.agent .md.opus { background: var(--ink); color: var(--paper); }
.agent .md.sonnet { background: transparent; color: var(--ink-2); border: 1.5px solid var(--ink-2); }
.agent.check { border-color: var(--bad); box-shadow: 0 16px 36px -22px rgba(232,72,58,.5); }
.agent.check .nm { color: #B3261E; }
.agent.judge { border-color: var(--warn); box-shadow: 0 16px 36px -22px rgba(232,147,12,.5); }
.agent.judge .nm { color: #965A00; }
.agent.write { border-color: var(--ink-2); box-shadow: 0 16px 36px -22px rgba(27,42,74,.4); }
.agent.write .nm { color: var(--ink-2); }

/* 스크립트 노드(사람·모델이 아닌 결정적 처리) */
.script { position: absolute; box-sizing: border-box; border-radius: 10px; border: 2px dashed var(--rule-2); background: transparent;
  padding: 10px 14px; font-family: var(--mono); font-size: 20px; color: var(--ink-2); white-space: nowrap; }
.script .cap { display: block; font-family: var(--sans); font-size: 20px; color: var(--mute); margin-top: 2px; white-space: normal; }
.human { position: absolute; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: #fff; padding: 10px 22px;
  font-size: 22px; font-weight: 700; white-space: nowrap; }

/* 표 */
.tbl { position: absolute; border-collapse: separate; border-spacing: 0; font-size: 24px; }
.tbl .tr { display: grid; align-items: center; border-bottom: 1.5px solid var(--rule); }
.tbl .th { font-size: 20px; font-weight: 700; color: var(--mute); padding: 12px 14px; }
.tbl .td { padding: 14px 14px; color: var(--ink); line-height: 1.35; }
.tbl .tr.head { border-bottom: 2px solid var(--ink); }

/* 도장 */
.stamp { position: absolute; font-size: 34px; font-weight: 850; letter-spacing: 0.04em; padding: 8px 20px; border: 5px solid currentColor;
  border-radius: 12px; transform-origin: 50% 50%; white-space: nowrap; mix-blend-mode: multiply; }
.stamp.ok { color: var(--ok); } .stamp.warn { color: var(--warn); } .stamp.bad { color: var(--bad); } .stamp.blue { color: var(--blue); }

/* 인용 */
.quote { position: absolute; font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.6; color: var(--ink); letter-spacing: -0.01em; }
.quote .src { display: block; font-family: var(--sans); font-weight: 500; font-size: 22px; color: var(--mute); margin-top: 16px; }

/* 하단 정보 */
.foot { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; pointer-events: none; z-index: 50; }
.foot .ch { position: absolute; left: 120px; bottom: 30px; font-size: 21px; font-weight: 600; color: rgba(27,42,74,.5); letter-spacing: -0.01em; padding-left: 28px; white-space: nowrap; }
.foot .ch::before { content: ""; position: absolute; left: 0; top: 50%; width: 15px; height: 15px; margin-top: -8px; background: var(--acc); transform: rotate(45deg) scale(.82); }
.foot .pg { position: absolute; right: 120px; bottom: 30px; font-size: 21px; font-weight: 600; color: rgba(27,42,74,.5); font-variant-numeric: tabular-nums; }
.foot.dark .ch, .foot.dark .pg { color: rgba(253,243,226,.55); }
.foot.dark .ch::before { background: var(--paper); }

/* 필름 재료: 작업장 그림, 말풍선, 하네스 칩, 역할 칩 */

.qbub { position: absolute; padding: 24px 34px 26px; background: var(--ink); color: #fff; border-radius: 28px 28px 28px 6px;
  font: 700 44px/1.2 var(--sans); letter-spacing: -0.02em; white-space: nowrap; transform-origin: 0% 100%; }
.qbub .tag { font: 600 24px/1 var(--sans); letter-spacing: 0.02em; color: #8CC2F2; margin-bottom: 12px; }
.hchip { display: inline-flex; align-items: center; padding: 10px 22px 11px; border-radius: 999px; color: #fff; font: 800 32px/1 var(--display);
  letter-spacing: -0.02em; white-space: nowrap; box-sizing: border-box; }
.rchip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 11px; background: #fff; border: 2px solid var(--ink); border-radius: 999px;
  font: 700 24px/1 var(--sans); color: var(--ink); white-space: nowrap; box-sizing: border-box; }
.rchip .dia { width: 20px; height: 20px; background: var(--ink); transform: rotate(45deg) scale(.72); display: inline-block; flex: none; }
.capbar { position: absolute; background: var(--ink); color: #fff; border-radius: 16px; padding: 18px 34px; font: 600 32px/1.35 var(--sans); letter-spacing: -0.015em; }

/* 전환 */
.wipe-edge { position: absolute; top: 0; bottom: 0; width: 10px; z-index: 40; pointer-events: none; display: none; }

/* 영상 장 */
.vid { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; background: var(--paper); }

  border-radius: 999px; padding: 10px 20px; cursor: pointer; backdrop-filter: blur(6px); }

#playov { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(27,42,74,.22); }
#playov[hidden] { display: none; }
#playov span { font: 700 22px var(--sans); color: #fff; background: #1B2A4A; border-radius: 999px; padding: 18px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
button:focus-visible { outline: 3px solid #2F7BFF; outline-offset: 3px; }

/* 화면 밖 UI(무대 비율과 무관) */

  background: rgba(27,42,74,.95); color: #FDF3E2; border-radius: 14px; padding: 18px 22px; font-size: 16px; line-height: 1.65; z-index: 100;
  display: none; box-sizing: border-box; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
#notes b { color: #8CC2F2; font-weight: 700; }
#notes.on { display: block; }
#help { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(27,42,74,.9); color: #fff; font-size: 14px;
  padding: 10px 16px; border-radius: 999px; z-index: 101; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .5s; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#help.on { opacity: 1; }
#help .tc { display: none; }
@media (hover: none), (max-width: 760px) { #help .kb { display: none; } #help .tc { display: inline; } #help { max-width: calc(100vw - 32px); white-space: normal; text-align: center; } }
#navzones { position: fixed; inset: 0; z-index: 5; display: flex; }
#navzones div { flex: 1; cursor: pointer; }
#navzones div:first-child { flex: 0.5; cursor: w-resize; }
#navzones div:last-child { cursor: e-resize; }
body.still #navzones, body.still #help, body.still #notes { display: none !important; }

</style>

<body>
<div id="navzones"><div title="이전 장"></div><div></div><div title="다음 장"></div></div>
<div id="wrap"><div id="stage"></div></div>
<div id="playov" hidden><span>▶ 재생</span></div>
<div id="notes"></div>
<div id="help"><span class="kb">→ 다음 · ← 이전 · N 발표자 노트 · F 전체 화면 · R 다시 보기 · 숫자+Enter 장 이동</span><span class="tc">왼쪽을 누르면 이전 · 나머지를 누르면 다음 · 옆으로 밀어 넘김</span></div>
<script>
document.body.classList.add('bg-paper');
/* ── lib/helpers.js ── */
/* 시간 함수 헬퍼 — showreel 엔진(engine.js)에서 옮겨 온 코드. 화면은 시간의 순수 함수로 그린다. */
(function () {
  'use strict';
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const map = (x, a, b, c, d, e) => lerp(c, d, (e || (p => p))(clamp((x - a) / (b - a))));

  // 큐빅 베지어 이징 (CSS cubic-bezier 와 같은 정의)
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t;
    const sy = t => ((ay * t + by) * t + cy) * t;
    const dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return p => {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      let t = p;
      for (let i = 0; i < 8; i++) {
        const e = sx(t) - p;
        if (Math.abs(e) < 1e-6) break;
        const d = dx(t);
        if (Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      return sy(clamp(t));
    };
  }

  const ease = {
    linear: p => p,
    inQuad: p => p * p,
    outQuad: p => 1 - (1 - p) * (1 - p),
    inOutQuad: p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
    inCubic: p => p * p * p,
    outCubic: p => 1 - Math.pow(1 - p, 3),
    inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    inQuart: p => p ** 4,
    outQuart: p => 1 - Math.pow(1 - p, 4),
    inOutQuart: p => (p < 0.5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2),
    outQuint: p => 1 - Math.pow(1 - p, 5),
    inExpo: p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inOutExpo: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
    outBack: (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
    inBack: (p, s = 1.70158) => (s + 1) * p * p * p - s * p * p,
    outElastic: p => (p <= 0 || p >= 1 ? clamp(p) : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
    inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
    // 모션 디자인에서 자주 쓰는 곡선(After Effects 감성)
    snap: bezier(0.16, 1, 0.3, 1),      // 강한 감속 등장 — 기본 등장 곡선
    swift: bezier(0.83, 0, 0.17, 1),    // 강한 in-out — 와이프·카메라 이동
    exit: bezier(0.7, 0, 0.84, 0),      // 가속 퇴장
    pop: bezier(0.34, 1.56, 0.64, 1),   // 살짝 넘쳤다 돌아옴 — 칩·아이콘
  };

  // start부터 dur 동안 0→1 (이징 적용)
  const prog = (t, start, dur, e = ease.snap) => e(clamp((t - start) / Math.max(1e-6, dur)));
  // 등장·퇴장 창: a에서 inDur 동안 0→1, b에서 outDur 동안 1→0
  const win = (t, a, b, inDur = 0.4, outDur = 0.3, ei = ease.snap, eo = ease.exit) =>
    Math.min(prog(t, a, inDur, ei), 1 - prog(t, b - outDur, outDur, eo));
  // 키프레임 보간: kf(t, [[0, 0], [0.5, 1, ease.outExpo], [2, 0]]) — 각 구간 이징은 도착 키프레임에 적는다
  function kf(t, frames) {
    if (t <= frames[0][0]) return frames[0][1];
    for (let i = 1; i < frames.length; i++) {
      const [t1, v1, e] = frames[i];
      const [t0, v0] = frames[i - 1];
      if (t <= t1) return lerp(v0, v1, (e || ease.inOutCubic)(clamp((t - t0) / Math.max(1e-6, t1 - t0))));
    }
    return frames[frames.length - 1][1];
  }
  // 감쇠 스프링(0→1). 정지 상태에서 t0에 출발. f=진동수(Hz), z=감쇠비
  function spring(t, t0 = 0, f = 2.2, z = 0.42) {
    const dt = t - t0;
    if (dt <= 0) return 0;
    const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
  }
  // 시드 고정 의사 난수 [0, 1)
  const rand = (i, salt = 0) => {
    const x = Math.sin(i * 12.9898 + salt * 78.233 + 0.1) * 43758.5453;
    return x - Math.floor(x);
  };
  // 부드러운 1차원 잡음 [-1, 1] — 손떨림·드리프트용
  const noise = (t, seed = 0) =>
    Math.sin(t * 1.31 + seed * 12.9) * 0.5 + Math.sin(t * 2.17 + seed * 7.3) * 0.3 + Math.sin(t * 3.73 + seed * 3.1) * 0.2;

  // 글자(또는 단어) 단위로 쪼개 span 배열을 돌려준다. 한글 음절·이모지는 한 글자.
  // mode: 'char' | 'word'. 마스크 리빌을 쓰려면 opts.mask = true (글자마다 overflow:hidden 래퍼)
  function split(el, mode = 'char', opts = {}) {
    const text = el.textContent;
    el.textContent = '';
    const units = [];
    const add = (str, isSpace) => {
      if (isSpace) { el.appendChild(document.createTextNode(str)); return; }
      let host = el;
      if (opts.mask) {
        host = document.createElement('span');
        host.className = 'mask';
        host.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:top;padding:.12em .04em .18em;margin:-.12em -.04em -.18em';
        el.appendChild(host);
      }
      const s = document.createElement('span');
      s.className = mode === 'word' ? 'w' : 'ch';
      s.style.display = 'inline-block';
      s.style.whiteSpace = 'pre';
      s.textContent = str;
      host.appendChild(s);
      units.push(s);
    };
    if (mode === 'word') {
      for (const part of text.split(/(\s+)/)) if (part) add(part, /^\s+$/.test(part));
    } else {
      const seg = new Intl.Segmenter('ko', { granularity: 'grapheme' });
      for (const { segment } of seg.segment(text)) add(segment, segment === ' ');
    }
    return units;
  }
  // i번째 요소의 지연 진행률
  const stagger = (t, start, each, dur, i, e = ease.snap) => prog(t, start + i * each, dur, e);

  // 등장과 퇴장을 모두 움직임으로: a 에서 아래·흐림·확대 상태로 들어오고, b 에서 위로 밀리며 줄고 흐려지며 나간다.
  // 투명도만 바꾸는 페이드는 화면이 멈춘 것처럼 보인다. 반환값은 보이는 정도(0~1).
  //   o: { inDur 0.45, outDur 0.4, rise 60, lift 140, blur 12, from 1.06, to 0.9, x 0, dx 0 }
  function inout(el, t, a, b, o = {}) {
    const pi = prog(t, a, o.inDur ?? 0.45, ease.snap);
    const po = b == null ? 0 : prog(t, b - (o.outDur ?? 0.4), o.outDur ?? 0.4, ease.exit);
    const v = Math.min(pi, 1 - po);
    if (v <= 0.001) { if (el.style.opacity !== '0') el.style.opacity = '0'; return 0; }
    const y = (1 - pi) * (o.rise ?? 60) - po * (o.lift ?? 140);
    const x = (1 - pi) * (o.x ?? 0) + po * (o.dx ?? 0);
    const s = lerp(o.from ?? 1.06, 1, pi) * lerp(1, o.to ?? 0.9, po);
    const bl = (1 - pi) * (o.blur ?? 12) + po * (o.blur ?? 12) * 0.8;
    el.style.opacity = v.toFixed(3);
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
    el.style.filter = bl > 0.3 ? `blur(${bl.toFixed(1)}px)` : 'none';
    return v;
  }

  // 나레이션 줄의 글자별 시작 시각(어절 시각을 글자 수로 나눔). split(el,'char') 결과와 함께 쓴다.
  const count = (p, to, { decimals = 0, comma = true, from = 0 } = {}) => {
    const v = lerp(from, to, clamp(p));
    return comma
      ? v.toLocaleString('ko-KR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
      : v.toFixed(decimals);
  };
  // 스크램블 디코드: p=0이면 무작위 글리프, p=1이면 최종 문자열. 한글은 한글 음절로, 라틴은 라틴으로 섞는다.
  const GLY = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&@/<>=+*';
  function scramble(final, p, t, seed = 1) {
    const a = [...final];
    const f = Math.floor(t * 30);
    return a.map((ch, i) => {
      if (ch === ' ' || p >= 1 || p >= (i / a.length) * 0.75 + 0.25) return ch;   // p=1 이면 반드시 원문
      const r = rand(i * 977 + f * 131, seed);
      if (/[가-힣]/.test(ch)) return String.fromCharCode(0xac00 + Math.floor(r * 11172));
      return GLY[Math.floor(r * GLY.length)];
    }).join('');
  }
  // 충격 흔들림: hits = [[t0, amp(px), decay(초)], ...] → {x, y, r}
  function shake(t, hits, freq = 75) {
    let x = 0, y = 0, r = 0;
    for (const [t0, amp = 12, d = 0.45] of hits) {
      const dt = t - t0;
      if (dt < 0 || dt > d * 2.5) continue;
      const k = amp * Math.exp(-(dt / d) * 5);
      x += k * Math.sin(dt * freq + t0 * 3);
      y += k * Math.cos(dt * (freq * 0.87) + t0 * 5);
      r += k * 0.03 * Math.sin(dt * freq * 0.7);
    }
    return { x, y, r };
  }
  // 펄스: 히트 시각마다 1에서 지수 감쇠 (빛·스케일 반응용)
  const pulse = (t, hits, decay = 0.25) => {
    let v = 0;
    for (const h of hits) { const dt = t - h; if (dt >= 0) v = Math.max(v, Math.exp(-dt / decay)); }
    return v;
  };

  const css = (el, o) => { for (const k in o) el.style[k] = o[k]; return el; };
  const h = (tag, cls, parent, html) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (html != null) el.innerHTML = html;
    if (parent) parent.appendChild(el);
    return el;
  };
  const svgNS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs, parent) => {
    const el = document.createElementNS(svgNS, tag);
    for (const k in attrs || {}) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };
  // 값이 바뀔 때만 쓰는 setter (DOM 쓰기 비용 절약)
  const set = (el, prop, v) => { if (el.style[prop] !== v) el.style[prop] = v; };
  window.RH = { ease, bezier, prog, win, kf, spring, clamp, lerp, map, rand, noise, split, stagger, inout, count, scramble, shake, pulse, css, h, s, set };
})();

/* ── deck.js ── */
/* 덱 런타임: 장 등록, 넘김, 전환, 영상 장, 발표자 노트, 검수 모드.
   장의 화면은 render(lt) 에서 lt(장에 들어온 뒤 지난 초)만으로 그린다. 같은 lt 면 같은 화면이 나와야
   검수 모드(?still=1)에서 찍은 스틸과 발표 화면이 일치한다. */
(function () {
  'use strict';
  const { ease, clamp } = RH;
  const W = 1920, H = 1080;
  const TRANS = 0.62;   // 장 전환 시간(초)
  const LEAD = 0.18;    // 전환이 반쯤 진행된 뒤부터 장의 시간이 흐른다
  const slides = [];
  const qs = new URLSearchParams(location.search);
  const STILL = qs.has('still');
  const REDUCED = !STILL && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DECK = (window.DECK = { slides, ready: false, W, H });
  DECK.slide = def => { slides.push(def); return def; };

  let wrap, stage, notesEl, helpEl, edgeEl, progEl, overlay;
  let cur = -1, enteredAt = 0, trans = null, keyBuf = '', keyTimer = 0;
  const now = () => performance.now() / 1000;

  function fit() {
    const g = STILL || document.fullscreenElement ? 0 : 16;
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min((vw - 2 * g) / W, (vh - 2 * g) / H);
    wrap.style.transform = `translate(${((vw - W * s) / 2).toFixed(2)}px, ${((vh - H * s) / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
  }

  function buildSlide(def, i) {
    const el = RH.h('div', 'slide bg-' + (def.bg || 'paper'), stage);
    el.dataset.i = i;
    const hz = def.harness && window.K && K.HZ ? K.HZ[def.harness] : null;
    if (hz) el.classList.add('hz-' + def.harness);
    const root = RH.h('div', 'root', el);
    def.el = el; def.root = root; def.index = i;
    if (def.video) {
      const v = RH.h('video', 'vid', root);
      v.src = def.video; if (def.poster) v.poster = def.poster;
      v.preload = i < 2 ? 'auto' : 'metadata'; v.playsInline = true; v.setAttribute('playsinline', '');
      def.videoEl = v;
      const ctl = RH.h('div', 'vid-ctrl', root);
      const bReplay = RH.h('button', '', ctl, '처음부터');
      const bSound = RH.h('button', '', ctl, '소리 끄기');
      bReplay.type = bSound.type = 'button';
      bReplay.onclick = e => { e.stopPropagation(); v.currentTime = 0; playVideo(def, true); };
      bSound.onclick = e => { e.stopPropagation(); v.muted = !v.muted; syncSound(def); };
      def.soundBtn = bSound;
      v.addEventListener('volumechange', () => syncSound(def));
    }
    if (def.setup) {
      try { def.setup(root, def); } catch (err) { console.error('[deck] setup', def.id, err); }
    }
    // 하네스 장: 필름의 머리말처럼 오른쪽 위에 그 하네스의 작업장 그림을 둔다
    // def.wimg 로 하네스가 아닌 장에도 필름 그림을 둘 수 있다(예: 사람이 정할 것 장의 검토 책상 g07_review)
    const wimg = def.wimg || (hz && hz.img);
    if (wimg && !def.video && def.icon !== false) {
      const ic = RH.h('img', 'wicon', el);
      ic.src = 'img/' + wimg + '_c.jpg'; ic.alt = '';
      if (def.icon && typeof def.icon === 'object') Object.assign(ic.style, def.icon);
      def._wicon = ic;
    }
    if (!def.video && def.foot !== false) {
      const dark = /ink|night|blue|navy|black/.test(def.bg || '');
      const f = RH.h('div', 'foot' + (dark ? ' dark' : ''), el);
      RH.h('div', 'ch', f, def.chapter || '');
      RH.h('div', 'pg', f, `${String(i + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`);
    }
  }

  function syncSound(def) { if (def.soundBtn) def.soundBtn.textContent = def.videoEl.muted ? '소리 켜기' : '소리 끄기'; }

  function playVideo(def, withSound) {
    const v = def.videoEl;
    if (withSound) v.muted = false;
    const p = v.play();
    syncSound(def);
    if (p && p.catch) p.catch(() => { overlay.hidden = false; overlay.dataset.for = def.index; });
  }

  function renderSlide(i, lt) {
    const def = slides[i];
    if (!def) return;
    if (def._wicon) {
      const p = RH.prog(lt, 0.15, 0.6, ease.outCubic);
      def._wicon.style.opacity = p.toFixed(3);
      def._wicon.style.transform = `translateY(${((1 - p) * 18).toFixed(1)}px)`;
    }
    if (!def.render) return;
    try { def.render(lt, def); } catch (err) {
      if (!def._err) { def._err = true; console.error('[deck] render', def.id, err); }
    }
  }

  function show(i, dir) {
    i = clamp(i, 0, slides.length - 1);
    if (i === cur) return;
    const prev = cur;
    const t = now();
    if (prev >= 0) {
      const pd = slides[prev];
      if (pd.videoEl) pd.videoEl.pause();
      if (pd.onLeave) pd.onLeave(pd);
    }
    overlay.hidden = true;
    cur = i;
    const def = slides[i];
    document.body.className = document.body.className.replace(/\bbg-\S+/g, '').trim() + ' bg-' + (def.bg || 'paper');
    if (STILL) document.body.classList.add('still');
    def.el.style.display = 'block';
    def.el.style.zIndex = 2;
    def._err = false;
    if (prev >= 0 && !REDUCED && !STILL) {
      if (trans) finishTrans();
      slides[prev].el.style.zIndex = 1;
      trans = { from: prev, to: i, t0: t, dir: dir || (i > prev ? 1 : -1), fromEntered: enteredAt };
    } else if (prev >= 0) {
      slides[prev].el.style.display = 'none';
    }
    enteredAt = t;
    if (def.videoEl && !STILL) { def.videoEl.currentTime = 0; playVideo(def, true); }
    if (def.onEnter) def.onEnter(def);
    progEl.style.width = (((i + 1) / slides.length) * 100).toFixed(2) + '%';
    progEl.style.background = /ink|night|blue|navy|black/.test(def.bg || '') ? 'rgba(253,243,226,.45)' : accentOf(def);
    if (notesEl.classList.contains('on')) fillNotes();
    if (!STILL) { try { history.replaceState(null, '', '#p' + (i + 1)); } catch (e) { /* 미리보기 등에서 막힐 수 있다 */ } }
    if (REDUCED) renderSlide(i, 60);
  }

  function accentOf(def) { const hz = def && def.harness && window.K && K.HZ ? K.HZ[def.harness] : null; return hz ? hz.c : '#1B2A4A'; }

  function finishTrans() {
    const from = slides[trans.from], to = slides[trans.to];
    if (trans.from !== cur) from.el.style.display = 'none';
    from.el.style.transform = '';
    to.el.style.clipPath = '';
    edgeEl.style.display = 'none';
    trans = null;
  }

  function frame() {
    const t = now();
    if (trans) {
      const p = clamp((t - trans.t0) / TRANS);
      const e = ease.swift(p);
      const inc = slides[trans.to].el, out = slides[trans.from].el;
      const cut = (1 - e) * 100;
      inc.style.clipPath = trans.dir > 0 ? `inset(0 0 0 ${cut.toFixed(3)}%)` : `inset(0 ${cut.toFixed(3)}% 0 0)`;
      out.style.transform = `translateX(${(-trans.dir * e * 4).toFixed(3)}%)`;
      edgeEl.style.display = p < 1 ? 'block' : 'none';
      const x = trans.dir > 0 ? (cut / 100) * W : (1 - cut / 100) * W;
      edgeEl.style.transform = `translateX(${(x - 5).toFixed(1)}px)`;
      edgeEl.style.background = /blue|navy|ink|night/.test(slides[trans.to].bg || '') ? '#FDF3E2' : accentOf(slides[trans.to]);
      renderSlide(trans.from, t - trans.fromEntered - LEAD);
      if (p >= 1) finishTrans();
    }
    if (!REDUCED && cur >= 0) renderSlide(cur, t - enteredAt - LEAD);
    requestAnimationFrame(frame);
  }

  function next() {
    if (!overlay.hidden) { const d = slides[+overlay.dataset.for]; overlay.hidden = true; if (d) playVideo(d, true); return; }
    show(cur + 1, 1);
  }
  function prev() { show(cur - 1, -1); }
  function replay() { enteredAt = now(); const d = slides[cur]; if (d.videoEl) { d.videoEl.currentTime = 0; playVideo(d, true); } if (REDUCED) renderSlide(cur, 60); }

  function fillNotes() {
    const d = slides[cur];
    notesEl.innerHTML = `<b>${cur + 1}. ${d.title || ''}</b><br>${(d.notes || '발표자 노트 없음').replace(/\n/g, '<br>')}`;
  }
  function toggleNotes() { notesEl.classList.toggle('on'); if (notesEl.classList.contains('on')) fillNotes(); }
  function toggleFull() {
    const r = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (r.requestFullscreen) r.requestFullscreen().catch(() => {});
    } catch (e) { /* 전체 화면을 막는 환경 */ }
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) {
      keyBuf += k; clearTimeout(keyTimer);
      keyTimer = setTimeout(() => { keyBuf = ''; }, 1500);
      return;
    }
    if (k === 'Enter' && keyBuf) { show(parseInt(keyBuf, 10) - 1); keyBuf = ''; e.preventDefault(); return; }
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'l', 'j'].includes(k)) { next(); e.preventDefault(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace', 'h', 'k'].includes(k)) { prev(); e.preventDefault(); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'n' || k === 'N' || k === 'ㅜ') toggleNotes();
    else if (k === 'f' || k === 'F' || k === 'ㄹ') toggleFull();
    else if (k === 'r' || k === 'R' || k === 'ㄱ') replay();
  }

  function hashIndex() {
    const m = /^#p(\d+)$/.exec(location.hash || '');
    return m ? clamp(parseInt(m[1], 10) - 1, 0, slides.length - 1) : 0;
  }

  async function boot() {
    wrap = document.getElementById('wrap');
    stage = document.getElementById('stage');
    notesEl = document.getElementById('notes');
    helpEl = document.getElementById('help');
    edgeEl = RH.h('div', 'wipe-edge', stage);
    const pb = RH.h('div', '', stage);
    pb.style.cssText = 'position:absolute;left:0;bottom:0;height:4px;width:100%;z-index:60;pointer-events:none';
    progEl = RH.h('div', '', pb);
    progEl.style.cssText = 'height:100%;width:0;transition:width .5s';
    overlay = document.getElementById('playov');
    if (STILL) document.body.classList.add('still');
    try { await document.fonts.ready; } catch (e) { /* 폰트 API 없음 */ }
    // place: { before: 'id' } 인 장은 그 장 앞으로 옮긴다(파일 순서와 발표 순서가 다를 때)
    slides.filter(d => d.place && d.place.before).forEach(d => {
      const j = slides.findIndex(x => x.id === d.place.before);
      if (j < 0) return;
      slides.splice(slides.indexOf(d), 1);
      slides.splice(slides.findIndex(x => x.id === d.place.before), 0, d);
    });
    slides.forEach(buildSlide);
    fit();
    window.addEventListener('resize', fit);
    document.addEventListener('fullscreenchange', fit);
    DECK.ready = true;
    if (STILL) {
      const s = parseInt(qs.get('s') || '1', 10) - 1;
      DECK.seek(s, parseFloat(qs.get('t') || '8'));
      return;
    }
    document.addEventListener('keydown', onKey);
    const zones = document.getElementById('navzones');
    zones.children[0].onclick = prev;
    zones.children[1].onclick = next;
    zones.children[2].onclick = next;
    overlay.onclick = e => { e.stopPropagation(); next(); };
    let tx = 0, ty = 0;
    window.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? next : prev)();
    }, { passive: true });
    window.addEventListener('hashchange', () => { const i = hashIndex(); if (i !== cur) show(i); });
    show(hashIndex());
    helpEl.classList.add('on');
    setTimeout(() => helpEl.classList.remove('on'), 5000);
    requestAnimationFrame(frame);
  }

  // 검수용: i 번째 장(0부터)을 시각 t 의 상태로 그린다. 전환 없이 그 장만 보인다.
  DECK.seek = (i, t) => {
    slides.forEach((d, j) => { if (j !== i) d.el.style.display = 'none'; });
    cur = -1; trans = null;
    show(i);
    slides[i].el.style.clipPath = '';
    renderSlide(i, t);
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

/* ── kit.js ── */
/* 덱 공통 컴포넌트와 움직임. 모든 움직임 함수는 (el, lt, t0, …) 를 받아 lt 만으로 상태를 정한다.
   setup 에서 요소를 만들고, render 에서 아래 함수로 움직인다. */
(function () {
  'use strict';
  const { ease, prog, clamp, lerp, h, s, css, split, count, kf, rand } = RH;
  const K = (window.K = {});

  // ── 만들기 ─────────────────────────────────────────────
  // 절대 위치 요소: K.at(parent, 'card', {x, y, w, h}, html)
  K.at = (parent, cls, box = {}, html) => {
    const el = h('div', cls, parent, html);
    el.style.position = 'absolute';
    if (box.x != null) el.style.left = box.x + 'px';
    if (box.y != null) el.style.top = box.y + 'px';
    if (box.r != null) el.style.right = box.r + 'px';
    if (box.b != null) el.style.bottom = box.b + 'px';
    if (box.w != null) el.style.width = box.w + 'px';
    if (box.h != null) el.style.height = box.h + 'px';
    return el;
  };
  K.chip = (parent, text, cls = 'id', box) => {
    const el = box ? K.at(parent, 'chip ' + cls, box, text) : h('span', 'chip ' + cls, parent, text);
    return el;
  };
  // 장 제목 묶음. 반환값의 render(lt, t0) 로 등장시킨다.
  // 필름(기록관리 하네스 120초)의 머리말과 같은 꼴: 왼쪽 세로 막대(하네스 색) + 회색 머리글 + Paperlogy 제목.
  K.title = (root, o) => {
    const g = K.at(root, '', { x: o.x ?? 120, y: o.y ?? 96, w: o.w ?? 1680 });
    let kick = null, sub = null;
    const head = h('div', 'thead', g);
    const bar = o.bar === false ? null : h('div', 'tbar', head);
    if (o.kicker) kick = h('div', 'kicker', head, `<span>${o.kicker}</span>`);
    const tt = h('div', o.big ? 'h-xl' : 'h-title', head);
    tt.style.marginTop = o.kicker ? '18px' : '0';
    if (o.size) tt.style.fontSize = o.size + 'px';
    const lines = String(o.title).split('\n');
    const words = [];
    lines.forEach((ln, li) => {
      const line = h('div', '', tt);
      line.textContent = ln;
      words.push(...split(line, 'word', { mask: true }));
    });
    if (o.sub) { sub = h('div', 'h-sub', g, o.sub); sub.style.marginTop = '22px'; if (o.subW) sub.style.maxWidth = o.subW + 'px'; }
    return {
      el: g, title: tt, sub, kick, bar,
      render(lt, t0 = 0) {
        if (bar) bar.style.transform = `scaleY(${prog(lt, t0, 0.35, ease.outCubic).toFixed(4)})`;
        if (kick) K.rise(kick, lt, t0 + 0.08, { y: 0, x: -24, dur: 0.45 });
        words.forEach((w, i) => {
          const p = prog(lt, t0 + 0.08 + i * 0.045, 0.6, ease.snap);
          w.style.transform = `translateY(${((1 - p) * 105).toFixed(1)}%)`;
        });
        if (sub) K.rise(sub, lt, t0 + 0.3 + words.length * 0.03, { y: 18 });
      },
    };
  };
  // 에이전트 노드: kind = make(생성, 군청) | check(검증, 주홍) | judge(중재, 주황) | write(작성, 먹색)
  K.agent = (parent, o) => {
    const el = K.at(parent, 'agent' + (o.kind && o.kind !== 'make' ? ' ' + o.kind : ''), { x: o.x, y: o.y, w: o.w ?? 300, h: o.h });
    h('div', 'nm', el, o.name);
    if (o.role) h('div', 'rl', el, o.role);
    if (o.model) h('div', 'md ' + o.model, el, o.model);
    if (o.note) { const n = h('div', 'small', el, o.note); n.style.marginTop = '6px'; n.style.fontSize = '20px'; n.style.lineHeight = '1.4'; }
    return el;
  };
  K.script = (parent, o) => K.at(parent, 'script', { x: o.x, y: o.y, w: o.w }, o.name + (o.cap ? `<span class="cap">${o.cap}</span>` : ''));
  K.human = (parent, o) => K.at(parent, 'human', { x: o.x, y: o.y, w: o.w }, o.text);
  K.stampEl = (parent, text, cls, box) => K.at(parent, 'stamp ' + cls, box, text);

  // SVG 층: 연결선·점 흐름용. 무대 전체를 덮는다.
  K.svg = (parent, box = { x: 0, y: 0, w: 1920, h: 1080 }) => {
    const el = s('svg', { width: box.w, height: box.h, viewBox: `0 0 ${box.w} ${box.h}` }, parent);
    css(el, { position: 'absolute', left: box.x + 'px', top: box.y + 'px', overflow: 'visible', pointerEvents: 'none' });
    return el;
  };
  // 연결선. pts = [[x,y],…] 이면 꺾은선(모서리 둥글게), d 문자열이면 그대로.
  K.path = (svg, pts, o = {}) => {
    const d = typeof pts === 'string' ? pts : roundPath(pts, o.radius ?? 18);
    const p = s('path', { d, fill: 'none', stroke: o.color || K.C.blue, 'stroke-width': o.width ?? 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
    if (o.dash) { p.setAttribute('stroke-dasharray', o.dash); p._dash = true; }
    p._len = p.getTotalLength();
    if (o.arrow) {
      p._arrow = s('path', { d: 'M -14 -8 L 0 0 L -14 8', fill: 'none', stroke: o.color || K.C.blue, 'stroke-width': o.width ?? 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
    }
    return p;
  };
  function roundPath(pts, r) {
    if (pts.length < 3 || !r) return 'M ' + pts.map(p => p.join(' ')).join(' L ');
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      const ax = x1 - ((x1 - x0) / l1) * rr, ay = y1 - ((y1 - y0) / l1) * rr;
      const bx = x1 + ((x2 - x1) / l2) * rr, by = y1 + ((y2 - y1) / l2) * rr;
      d += ` L ${ax.toFixed(1)} ${ay.toFixed(1)} Q ${x1} ${y1} ${bx.toFixed(1)} ${by.toFixed(1)}`;
    }
    const l = pts[pts.length - 1];
    return d + ` L ${l[0]} ${l[1]}`;
  }
  // 선 위를 흐르는 점 n 개를 만든다(setup 에서). render 에서 K.flow 로 움직인다.
  K.dots = (svg, path, n = 3, o = {}) => {
    path._dots = [];
    for (let i = 0; i < n; i++) path._dots.push(s('circle', { r: o.r ?? 6, fill: o.color || K.C.blue, opacity: 0 }, svg));
    return path._dots;
  };

  // ── 움직임 ─────────────────────────────────────────────
  // 들어오기: 아래(또는 x 방향)에서 짧게 붙는다. 반환값 0~1.
  K.rise = (el, lt, t0, o = {}) => {
    const p = prog(lt, t0, o.dur ?? 0.5, o.ease || ease.snap);
    const y = (1 - p) * (o.y ?? 28), x = (1 - p) * (o.x ?? 0);
    el.style.opacity = p.toFixed(3);
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)` + (o.scale ? ` scale(${lerp(o.scale, 1, p).toFixed(4)})` : '');
    const bl = (1 - p) * (o.blur ?? 6);
    el.style.filter = bl > 0.2 ? `blur(${bl.toFixed(1)}px)` : '';
    return p;
  };
  // 튀어나오기(칩·노드): 0.86 → 1, 살짝 넘침
  K.pop = (el, lt, t0, o = {}) => {
    const p = prog(lt, t0, o.dur ?? 0.45, ease.pop);
    const a = prog(lt, t0, 0.18, ease.linear);
    el.style.opacity = a.toFixed(3);
    el.style.transform = `scale(${lerp(o.from ?? 0.86, 1, p).toFixed(4)})`;
    return a;
  };
  // 도장: 크게(1.6) 나타나 무겁게 내려앉는다
  K.stamp = (el, lt, t0, o = {}) => {
    const rot = o.rot ?? -6;
    if (lt < t0) { el.style.opacity = '0'; return 0; }
    const sc = kf(lt, [[t0, 1.6], [t0 + 0.14, 0.95, ease.inQuad], [t0 + 0.26, 1, ease.outQuad]]);
    el.style.opacity = clamp((lt - t0) / 0.06).toFixed(3);
    el.style.transform = `rotate(${rot}deg) scale(${sc.toFixed(4)})`;
    return 1;

      d.note.style.cssText += ';font:700 32px/1 var(--sans);color:var(--ink-2);white-space:nowrap';
      const P = [
        ['assign', 'kac-record-assign/output/t1/배정결과.xlsx'],
        ['audit', 'kac-classification-audit/output/test01/정정안.csv'],
        ['naming', 'kac-unit-task-naming/output/20261117-감사실/단위업무_제안표.xlsx'],
        ['orgchange', 'kac-org-change-impact/output/시나리오-신공항건설1부이동/영향도_보고서.md'],
        ['strategy', 'kac-org-strategy/output/20261117-safety/조직개편_추천보고서.md'],
      ];
      // 필름 마지막 질문으로 끝낸다. 표지가 이 질문에서 시작했고, 답은 다음 실행이다(한계와 다음 단계 장)
      d.Q = K.question(root, '그럼, 첫 문서부터 분류해 볼까요?', { x: 1090, y: 812, person: { x: 70, y: 110, w: 120 }, bx: 150, by: 40, size: 34, pad: '18px 28px 20px', tagSize: 21 });
      d.nx = K.at(root, '', { x: 1240, y: 990 }, '다음 실행 · 감사실·제주운영단 2026년 남은 고유 제목 14,259개');
      d.nx.style.cssText += ';font-size:21px;font-weight:700;color:var(--ink-2);white-space:nowrap';
      d.ph = K.at(root, '', { x: 120, y: 470 }, '결과 파일'); d.ph.style.cssText += ';font-size:24px;font-weight:700;color:var(--mute)';
      d.ps = P.map(([k, p], i) => {
        const g = K.at(root, '', { x: 120, y: 516 + i * 76, w: 1100 });
        const c = K.hchip(g, k, { x: 0, y: 0, w: 236 }); c.style.fontSize = '25px'; c.style.padding = '9px 0 10px'; c.style.justifyContent = 'center';
        const e = K.at(g, 'mono', { x: 256, y: 10 }, p); e.style.cssText += ';font-size:19px;color:var(--ink);white-space:nowrap';
        return g;
      });
    },
    render(lt, d) {
      d.w1.forEach((w, i) => { const p = RH.stagger(lt, 0.15, 0.025, 0.55, i); w.style.transform = `translateY(${((1 - p) * 120).toFixed(1)}%)`; });
      d.w2.forEach((w, i) => { const p = RH.stagger(lt, 0.65, 0.03, 0.55, i); w.style.transform = `translateY(${((1 - p) * 120).toFixed(1)}%)`; });
      K.rise(d.note, lt, 1.1, { y: 12 });
      K.rise(d.ph, lt, 1.3, { y: 10 });
      d.ps.forEach((e, i) => K.rise(e, lt, 1.4 + i * 0.09, { x: -16, y: 0 }));
      d.Q.render(lt, 2.0, 24);
      K.rise(d.nx, lt, 3.4, { y: 8 });
      const pa = prog(lt, 0.2, 0.9, ease.outCubic);
      d.arch.style.opacity = pa.toFixed(3);
      d.arch.style.transform = `translateY(${((1 - pa) * 40).toFixed(1)}px) scale(${(1 + 0.03 * prog(lt, 1, 9, ease.inOutSine)).toFixed(4)})`;
    },
  });
})();

</script>
