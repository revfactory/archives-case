<!doctype html>
<html lang="ko" data-fonts="Pretendard">
<head>
<meta charset="utf-8">
<title>intro</title>
<!-- fonts/fonts.css 는 new_project.py 가 실제로 있는 폰트만 골라 만든다(굵기마다 @font-face). -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ── 색 토큰: 회색 자리 표시 값이다. concept.md 의 아트 디렉션으로 바꾼다.
        구간마다 팔레트가 다르면 장면 안에서 직접 색을 정하고, 여기에는 공통 값만 둔다 ── */
  :root {
    --bg: #000000;          /* 클립 구간은 검정(합성 때 클립이 비친다) */
    --ink: #0F172A;         /* 원자료 */
    --dim: rgba(15,23,42,.55);
    --accent: #2443F0;      /* 에이전트·하네스 */
    --accent2: #E5484D;     /* 오류·정정 */
    --paper: #F2EFE7; --night: #0B1222; --ok: #0E9F6E; --warn: #D97706; --bad: #E5484D;
    --display: "Pretendard", sans-serif;          /* 한글 헤드라인 900 */
    --serif: "Noto Serif KR", "Pretendard", serif; /* 이름·인용 */
    --num: "Anton", "Pretendard", sans-serif;      /* 거대 숫자 */
    --mono: "JetBrains Mono", "Pretendard", monospace; /* 라벨·HUD (한글 폴백 필수) */
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { transform-origin: 0 0; }
  #stage { position: relative; overflow: hidden; background: var(--bg); color: var(--ink);
           font-family: "Pretendard", sans-serif; font-kerning: normal; -webkit-font-smoothing: antialiased;
           word-break: keep-all; }
  .cam, .top, .scene { position: absolute; inset: 0; }
  .scene { overflow: hidden; }
  .a { position: absolute; }                     /* 절대 배치 헬퍼 */
  .full { position: absolute; inset: 0; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .display { font-family: var(--display); font-weight: 900; letter-spacing: -0.045em; line-height: 1.05; }
  /* .label 은 _example_scenes.js 가 쓰는 예시 클래스다. 구간 라벨의 모양은 아트 디렉션으로 정한다 */
  .label { font-family: var(--mono); font-weight: 500; letter-spacing: .22em; text-transform: uppercase; font-size: 18px; color: var(--dim); }
  /* 미리보기 플레이어 */
  .player { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 12px; align-items: center;
            padding: 0 12px; background: #111; color: #bbb; font: 12px/1 Menlo, monospace; }
  .player .scrub { flex: 1; }
  /* ── 장면별 스타일 ── */
  .mono { font-family: var(--mono); letter-spacing: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .node { position: absolute; box-sizing: border-box; border-radius: 12px; border: 2.5px solid var(--accent); background: #FBFAF6;
          font-family: var(--mono); font-size: 15px; font-weight: 500; line-height: 1.25; color: #1A2FB8; padding: 9px 10px; }
  .tag { position: absolute; font-size: 22px; font-weight: 700; padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
  .stamp { position: absolute; font-weight: 850; letter-spacing: .04em; border: 5px solid currentColor; border-radius: 12px; padding: 6px 18px; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script src="timeline.js"></script>  <!-- timeline.py 가 만든다(없으면 빈 TL). 나레이션·큐 시각의 단일 원천 -->
<script src="engine.js"></script>
<script src="fx.js"></script>
<script src="lib/deckdata.js"></script>
<script src="scenes.js"></script>
</body>
</html>
